name: SafarGo Customer Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Recreate Android Project
      run: |
        rm -rf android
        flutter create . --org com.example --project-name safargo_customer --platforms android

    - name: Configure Native Firebase Android
      run: |
        mkdir -p android/app
        cp google-services.json android/app/google-services.json 2>/dev/null || true
        
        # Inject Classpath into root android/build.gradle
        python3 -c "
        with open('android/build.gradle', 'r') as f:
            content = f.read()
        content = content.replace('dependencies {', 'dependencies {\n        classpath \'com.google.gms:google-services:4.3.15\'')
        with open('android/build.gradle', 'w') as f:
            f.write(content)
        "

        # Apply Plugin into android/app/build.gradle
        python3 -c "
        with open('android/app/build.gradle', 'r') as f:
            content = f.read()
        content = 'apply plugin: \'com.google.gms.google-services\'\n' + content
        with open('android/app/build.gradle', 'w') as f:
            f.write(content)
        "

        # Set minimum SDK version to 23
        python3 -c "
        with open('android/app/build.gradle', 'r') as f:
            content = f.read()
        content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
        with open('android/app/build.gradle', 'w') as f:
            f.write(content)
        "

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
