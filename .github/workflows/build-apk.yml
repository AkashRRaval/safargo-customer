name: SafarGo Customer Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Upgrade Android Embedding & Configure Firebase Plugin
      run: |
        flutter create --platforms=android --org=com.safargo --project-name=safargo_customer .
        mkdir -p android/app
        cp google-services.json android/app/google-services.json
        echo 'plugins { id "com.google.gms.google-services" version "4.4.1" apply false }' >> android/settings.gradle
        echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
