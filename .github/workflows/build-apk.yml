name: SafarGo Customer Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Upgrade Android Embedding & Copy Config
      run: |
        flutter create --platforms=android --org=com.safargo --project-name=safargo_customer .
        mkdir -p android/app
        cp google-services.json android/app/google-services.json

    - name: Generate Firebase Options
      run: |
        python3 -c '
        import json
        with open("google-services.json") as f:
            d = json.load(f)
        p = d["project_info"]
        c = d["client"][0]
        lines = [
            "import \"package:firebase_core/firebase_core.dart\" show FirebaseOptions;\n\n",
            "class DefaultFirebaseOptions {\n",
            "  static const FirebaseOptions currentPlatform = FirebaseOptions(\n",
            "    apiKey: \"" + c["api_key"][0]["current_key"] + "\",\n",
            "    appId: \"" + c["client_info"]["mobilesdk_app_id"] + "\",\n",
            "    messagingSenderId: \"" + p["project_number"] + "\",\n",
            "    projectId: \"" + p["project_id"] + "\",\n",
            "    storageBucket: \"" + p.get("storage_bucket", "") + "\",\n",
            "  );\n",
            "}\n"
        ]
        with open("lib/firebase_options.dart", "w") as out:
            out.writelines(lines)
        '

    - name: Generate Keystore & Print SHA-1
      run: |
        keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        echo "=== YOUR SHA1 FINGERPRINT BELOW ==="
        keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
        echo "==================================="

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
