name: SafarGo Customer Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Clean & Re-create Flutter Android Structure
      run: |
        rm -rf android
        flutter create . --org com.example --project-name safargo_customer --platforms android

    - name: Configure Android for Firebase
      run: |
        mkdir -p android/app
        
        # Copy google-services.json to android/app
        cp google-services.json android/app/ 2>/dev/null || true
        
        # Inject Google Services dependency in Root build.gradle
        sed -i "s/dependencies {/dependencies {\n        classpath 'com.google.gms:google-services:4.3.15'/" android/build.gradle || true

        # Apply Google Services plugin in App build.gradle
        echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle || true

        # Set minSdkVersion to 23
        sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle || true
        sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle || true

    - name: Get Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
